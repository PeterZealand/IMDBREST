<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
        <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <title>New Actor</title>
    </head>
    <body>
        <div id="newActor" class="container">
            <h5>
                Insert Actor
            </h5>
            <button class="btn btn-primary" @click="backToFront">Back</button>
            <div class="col-2">
                Primary Name (Required):
                <input type="text" v-model="actor.primaryName" placeholder="Primary Name">

                Birth Year:
                <input type="number" v-model="actor.birthYear" placeholder="Birth Year">

                Death Year:
                <input type="number" v-model="actor.deathYear" placeholder="Death Year">
                <br>

                Primary Professions:
                <select v-model="actor.primaryProfessions" multiple>
                    <option disabled value="">Select Multiple</option>
                    <option v-for="profession in professions"> {{profession}}</option>
                </select>
                <br>

                Known For: <br>
                Search for Title:
                <input type="text" v-model="titleSearchTerm" @change="searchTitle" placeholder="eg. Humpty Dumpty...">
                <select v-model="actor.knownForTitles" multiple>
                    <option disabled value="">Select Multiple</option>
                    <option v-for="title in titles"> {{title}}</option>
                </select>

            </div>
            <br>
            <button class="btn btn-primary" @click="insertNewActor">Add</button>

            <br><br>
            {{actor}}
            <br><br>
        </div>

        <script src="createNewActorPage.js"></script>
    </body>
</html>
