<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />
        <title>IMDB REST Frontend</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous"
        />
        <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
        <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    </head>
    <body>
        <div id="app" class="container py-4">
            <h1 class="mb-4">IMDB Search</h1>

            <div class="row g-4">
                <!-- Titles search -->
                <div>
                    <div class="col-12 col-lg-6">
                        <div class="card h-100">
                            <div class="card-header">Search Titles</div>
                            <div class="card-body">
                                <div class="input-group mb-3">
                                    <input
                                        type="text"
                                        class="form-control"
                                        placeholder="Type a title (min. 2 characters)"
                                        v-model.trim="search.titles"
                                        @input="onInputTitles"
                                    />
                                    <button class="btn btn-primary" type="button" @click="searchTitles(true)" :disabled="search.titles.length < 2">
                                        Search
                                    </button>
                                    <button class="btn btn-outline-secondary" type="button" @click="clearTitles" :disabled="!search.titles && results.titles.length===0">
                                        Clear
                                    </button>
                                </div>

                                <div v-if="loading.titles" class="text-secondary mb-2">
                                    <span class="spinner-border spinner-border-sm"></span>
                                    Loading...
                                </div>
                                <div v-if="error.titles" class="alert alert-danger py-2">
                                    {{ error.titles }}
                                </div>
                                <div v-if="!loading.titles && !error.titles">
                                    <p v-if="results.titles.length > 0" class="text-muted">
                                        Found {{ results.titles.length }} title(s)
                                    </p>
                                    <p v-else-if="search.titles.length >= 2" class="text-muted">No results</p>
                                    <ul class="list-group">
                                        <li v-for="(t, idx) in results.titles" :key="'t-'+idx" class="list-group-item">
                                            {{ t }}
                                            <button class="btn btn-primary" @click="getMoreInfoTitle(t)">More info</button>
                                            <button class="btn btn-danger" @click="getMoreInfoTitle(t)">Delete</button>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="container">
                    <button class="btn btn-primary" @click="startCreateNewTitleMethod">Create New Title</button>
                </div>
                <div>
                    <!-- Actors search -->
                    <div class="col-12 col-lg-6">
                        <div class="card h-100">
                            <div class="card-header">Search Actors</div>
                            <div class="card-body">
                                <div class="input-group mb-3">
                                    <input
                                        type="text"
                                        class="form-control"
                                        placeholder="Type an actor name (min. 2 characters)"
                                        v-model.trim="search.actors"
                                        @input="onInputActors"
                                    />
                                    <button class="btn btn-primary" type="button" @click="searchActors(true)" :disabled="search.actors.length < 2">
                                        Search
                                    </button>
                                    <button class="btn btn-outline-secondary" type="button" @click="clearActors" :disabled="!search.actors && results.actors.length===0">
                                        Clear
                                    </button>
                                </div>

                                <div v-if="loading.actors" class="text-secondary mb-2">
                                    <span class="spinner-border spinner-border-sm"></span>
                                    Loading...
                                </div>
                                <div v-if="error.actors" class="alert alert-danger py-2">
                                    {{ error.actors }}
                                </div>
                                <div v-if="!loading.actors && !error.actors">
                                    <p v-if="results.actors.length > 0" class="text-muted">
                                        Found {{ results.actors.length }} actor(s)
                                    </p>
                                    <p v-else-if="search.actors.length >= 2" class="text-muted">No results</p>
                                    <ul class="list-group">
                                        <li v-for="(a, idx) in results.actors" :key="'a-'+idx" class="list-group-item">
                                            {{ a }}
                                            <button @click="getMoreInfoActor(a)">More info</button>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <br>
                <div class="container">
                    <button class="btn btn-primary" @click="startCreateNewActorMethod">Create New Actor</button>
                </div>
            </div>
        </div>

        <script src="index.js" defer></script>
    </body>
</html>
